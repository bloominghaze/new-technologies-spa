<div class="search-container">
  <input
    type="text"
    class="search-input"
    placeholder="Пошук технології за назвою..."
    [(ngModel)]="searchText"
    (ngModelChange)="onSearchChange()">
</div>

<hr>

<div class="list-container">
  <app-item-card
    *ngFor="let tech of technologies"
    [technology]="tech">
  </app-item-card>
</div>
